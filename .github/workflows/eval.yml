name: Subtitle quality

# Makes AI subtitles for Blender's open movie "Tears of Steel" (CC-BY, dialogue over music and effects)
# the same way Ripple's jobs do, and scores them against the film's official English subtitles:
# lines caught, start/end timing and layout. Run by hand or by pushing to an eval/* branch.
on:
  push:
    branches: ["eval/**"]
  workflow_dispatch:

env:
  WHISPER_CPP: "1.8.2"

jobs:
  eval:
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: [small]
        audio: [stereo]
        variant: [base, low, both, both-plain]
        include:
          - variant: base
            vad_src: center
            vad_on: "0.5"
            vad_off: "0.3"
            asr_src: center
          - variant: low
            vad_src: center
            vad_on: "0.35"
            vad_off: "0.2"
            asr_src: center
          - variant: both
            vad_src: both
            vad_on: "0.35"
            vad_off: "0.2"
            asr_src: center
          - variant: both-plain
            vad_src: both
            vad_on: "0.35"
            vad_off: "0.2"
            asr_src: plain
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish Caption.exe
        run: dotnet publish src/Caption/Caption.csproj -c Release -r win-x64 -o publish

      - name: Get engine, models and the film
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force test/engine | Out-Null
          Invoke-WebRequest "https://github.com/ggml-org/whisper.cpp/releases/download/v$env:WHISPER_CPP/whisper-bin-x64.zip" -OutFile test/cpu.zip
          Expand-Archive test/cpu.zip test/zip
          foreach ($f in 'whisper.dll','ggml.dll','ggml-base.dll','ggml-cpu.dll') { Copy-Item "test/zip/Release/$f" test/engine/ }
          Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-${{ matrix.model }}.bin" -OutFile "test/ggml-${{ matrix.model }}.bin"
          Invoke-WebRequest "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin" -OutFile test/vad.bin
          Invoke-WebRequest "https://download.blender.org/demo/movies/ToS/subtitles/TOS-en.srt" -OutFile test/ref.srt
          if ('${{ matrix.audio }}' -eq 'surround') {
            Invoke-WebRequest "https://download.blender.org/demo/movies/ToS/Surround-TOS_DVDSURROUND-Dolby%205.1.ac3" -OutFile test/film.ac3
          }
          # The stereo mix and the same mix without dialogue: their difference is the dialogue alone.
          Invoke-WebRequest "https://download.blender.org/demo/movies/ToS/TOS_DVDSTEREOMIX.aif" -OutFile test/mix.aif
          Invoke-WebRequest "https://download.blender.org/demo/movies/ToS/TOS_MUSIC%2BFX_NO_DIALOGUE.aif" -OutFile test/musicfx.aif
          Get-ChildItem test | Format-Table Name, Length

      - name: Make and score subtitles
        shell: pwsh
        env:
          CAPTION_BEAM: "5"
          CAPTION_DEBUG: "1"
          CAPTION_THREADS: "4"
          CAPTION_VAD_SRC: ${{ matrix.vad_src }}
          CAPTION_VAD_ON: ${{ matrix.vad_on }}
          CAPTION_VAD_OFF: ${{ matrix.vad_off }}
          CAPTION_ASR_SRC: ${{ matrix.asr_src }}
        run: |
          $root = (Get-Location).Path
          $film = if ('${{ matrix.audio }}' -eq 'surround') { "$root/test/film.ac3" } else { "$root/test/mix.aif" }
          $p = Start-Process -FilePath "$root/publish/Caption.exe" -PassThru -Wait -ArgumentList @(
            '--subeval', "`"$root/test/engine`"", "`"$root/test/ggml-${{ matrix.model }}.bin`"", "`"$film`"", "`"$root/test/ref.srt`"", "`"$root/out`"", '--dialogue', "`"$root/test/mix.aif`"", "`"$root/test/musicfx.aif`"")
          if (Test-Path out/report.txt) { Get-Content out/report.txt } else { Write-Host "no report" }
          $log = Join-Path $env:LOCALAPPDATA 'Caption\caption.log'
          if (Test-Path $log) { Write-Host '--- caption.log'; Get-Content $log }
          Copy-Item test/ref.srt out/ -ErrorAction SilentlyContinue
          Copy-Item $log out/caption.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "eval failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.model }}-${{ matrix.audio }}-${{ matrix.variant }}
          path: out/
